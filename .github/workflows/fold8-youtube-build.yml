name: Build Fold8 YouTube patch bundle
# Retry after source compatibility fix

on:
  push:
    branches:
      - fold8-youtube-patches
    paths:
      - '.github/workflows/fold8-youtube-build.yml'
      - 'fold8-patch/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fold8-youtube-patches
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned anddea patches
        run: |
          git clone https://github.com/anddea/revanced-patches.git upstream
          cd upstream
          git checkout d4c3ce4b67155c4ea728aa831f5485bdb3d75934

      - name: Apply Fold8 Ultra layout modification
        run: python3 fold8-patch/apply_fold8_patch.py

      - name: Build Android patch bundle
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Prepare stable bundle and source manifest
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(find upstream/patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)"
          if [ -z "$BUNDLE" ]; then
            echo 'No .mpp bundle found in patches/build/libs' >&2
            find upstream/patches/build/libs -maxdepth 2 -type f -print || true
            exit 1
          fi
          cp "$BUNDLE" fold8-patches.mpp
          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > patches-bundle.json <<JSON
          {
            "created_at": "${CREATED_AT}",
            "description": "Galaxy Fold8 Ultra custom YouTube bundle based on anddea/revanced-patches v4.3.0. Folded=stock, unfolded portrait=Phone UI, unfolded landscape=Tablet UI.",
            "download_url": "https://raw.githubusercontent.com/Adamkk111/weather-calendar/fold8-youtube-patches/fold8-patches.mpp",
            "signature_download_url": null,
            "version": "4.3.0-fold8.1"
          }
          JSON

      - name: E2E verify on real YouTube 21.13.164 APK
        shell: bash
        env:
          MORPHE_DATA_DIR: ${{ github.workspace }}/e2e/morphe-data
        run: |
          set -euo pipefail
          mkdir -p e2e
          npm init -y >/dev/null 2>&1
          npm install apkmirror-downloader@2.0.11 >/dev/null 2>&1
          cat > e2e/download-youtube.mjs <<'NODE'
          import { APKMirrorDownloader } from "apkmirror-downloader";
          const downloader = new APKMirrorDownloader({ outDir: "e2e", overwrite: true });
          await downloader.download(
            { org: "google-inc", repo: "youtube" },
            { version: "21.13.164", type: "apk", outFile: "youtube-21.13.164" }
          );
          NODE
          node e2e/download-youtube.mjs
          APK="$(find e2e -maxdepth 1 -type f -name 'youtube-21.13.164*.apk' | head -n1)"
          test -n "$APK"
          mv "$APK" e2e/youtube.apk

          URL="$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n1)"
          test -n "$URL"
          curl -fL "$URL" -o e2e/morphe-desktop.jar

          java -jar e2e/morphe-desktop.jar list-patches -p fold8-patches.mpp > e2e/patch-list.txt
          for P in "Change form factor" "Theme" "Hide ads" "Return YouTube Dislike" "Wide search bar" "Hide player buttons" "Toolbar components" "GmsCore support"; do
            grep -F "$P" e2e/patch-list.txt >/dev/null
          done

          java -jar e2e/morphe-desktop.jar patch \
            -p fold8-patches.mpp \
            --exclusive \
            -e "Change form factor" \
            -e "Theme" \
            -e "Hide ads" \
            -e "Return YouTube Dislike" \
            -e "Wide search bar" \
            -e "Hide player buttons" \
            -e "Toolbar components" \
            -e "GmsCore support" \
            -o e2e/youtube-fold8-patched.apk \
            -r e2e/result.json \
            e2e/youtube.apk 2>&1 | tee e2e/patch.log

          test -s e2e/youtube-fold8-patched.apk
          unzip -t e2e/youtube-fold8-patched.apk >/dev/null
          ORIG="$(sha256sum e2e/youtube.apk | cut -d' ' -f1)"
          PATCHED="$(sha256sum e2e/youtube-fold8-patched.apk | cut -d' ' -f1)"
          test "$ORIG" != "$PATCHED"
          echo "E2E_VERIFY_SUCCESS" > e2e/verification.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fold8-youtube-patches
          path: |
            fold8-patches.mpp
            patches-bundle.json

      - name: Publish bundle to source branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold8-patches.mpp patches-bundle.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'build: publish Fold8 YouTube patch bundle [skip ci]'
          git push origin HEAD:fold8-youtube-patches
