name: Update Weather ICS

on:
  schedule:
    # GitHub cron은 UTC 기준: KST 02:15, 05:15, 08:15, 11:15,
    # 14:15, 17:15, 20:15, 23:15에 실행됩니다.
    - cron: '15 17,20,23,2,5,8,11,14 * * *'
  repository_dispatch:
    types: [update-weather-ics]
  push:
    branches:
      - main
    paths:
      - 'update_calendar.py'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write

# 서로 다른 워크플로 실행끼리는 겹치지 않지만, 한 실행 안의 5개 fetch job은 병렬로 돕니다.
concurrency:
  group: weather-calendar-update
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch attempt ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Record runner IP
        id: runner_ip
        continue-on-error: true
        run: |
          IP=$(curl -fsS --max-time 10 https://api.ipify.org || echo "unknown")
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Runner IP: $IP"

      - name: Update weather calendar
        id: update_weather
        continue-on-error: true
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          KMA_NX: ${{ secrets.KMA_NX }}
          KMA_NY: ${{ secrets.KMA_NY }}
          LOCATION_NAME: ${{ secrets.LOCATION_NAME }}
          REG_ID_TEMP: ${{ secrets.REG_ID_TEMP }}
          REG_ID_LAND: ${{ secrets.REG_ID_LAND }}
          TZ: Asia/Seoul
        run: python -u update_calendar.py

      - name: Build attempt result
        if: always()
        env:
          ATTEMPT: ${{ matrix.attempt }}
          RUNNER_IP: ${{ steps.runner_ip.outputs.ip }}
          SCRIPT_OUTCOME: ${{ steps.update_weather.outcome }}
        run: |
          mkdir -p result

          if [ -f weather.ics ]; then
            cp weather.ics result/weather.ics
          fi
          if [ -f weather_status.json ]; then
            cp weather_status.json result/weather_status.json
          fi

          CACHE_COUNT=999
          COMPLETE=false
          if [ -f weather_status.json ]; then
            CACHE_COUNT=$(jq -r '.cache_count // 999' weather_status.json)
            COMPLETE=$(jq -r '.complete // false' weather_status.json)
          fi

          jq -n \
            --argjson attempt "$ATTEMPT" \
            --arg ip "${RUNNER_IP:-unknown}" \
            --arg outcome "$SCRIPT_OUTCOME" \
            --argjson cache_count "$CACHE_COUNT" \
            --argjson complete "$COMPLETE" \
            '{attempt:$attempt, ip:$ip, outcome:$outcome, cache_count:$cache_count, complete:$complete}' \
            > result/report.json

      - name: Upload attempt result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-attempt-${{ matrix.attempt }}
          path: result/
          retention-days: 2

  commit:
    name: Select best result and commit
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download attempt results
        uses: actions/download-artifact@v4
        with:
          pattern: weather-attempt-*
          path: attempts
          merge-multiple: false

      - name: Select fully fresh result
        id: select
        shell: bash
        run: |
          echo "### 기상청 API 5개 러너 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Attempt | Runner IP | 스크립트 | 캐시 날짜 수 | 판정 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---|---|---:|---|" >> "$GITHUB_STEP_SUMMARY"

          BEST_DIR=""
          BEST_ATTEMPT=""
          BEST_CACHE=999

          for DIR in attempts/weather-attempt-*; do
            [ -d "$DIR" ] || continue
            REPORT="$DIR/report.json"
            [ -f "$REPORT" ] || continue

            ATTEMPT=$(jq -r '.attempt' "$REPORT")
            IP=$(jq -r '.ip' "$REPORT")
            OUTCOME=$(jq -r '.outcome' "$REPORT")
            CACHE_COUNT=$(jq -r '.cache_count' "$REPORT")
            COMPLETE=$(jq -r '.complete' "$REPORT")

            VERDICT="❌ 실패"
            if [ "$OUTCOME" = "success" ] && [ "$COMPLETE" = "true" ] && \
               [ -f "$DIR/weather.ics" ] && [ -f "$DIR/weather_status.json" ]; then
              if [ "$CACHE_COUNT" -eq 0 ]; then
                VERDICT="✅ 완전 최신"
              else
                VERDICT="⚠️ 캐시 사용"
              fi

              if [ "$CACHE_COUNT" -lt "$BEST_CACHE" ]; then
                BEST_CACHE="$CACHE_COUNT"
                BEST_DIR="$DIR"
                BEST_ATTEMPT="$ATTEMPT"
              fi
            fi

            echo "| $ATTEMPT | $IP | $OUTCOME | $CACHE_COUNT | $VERDICT |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$BEST_DIR" ] && [ "$BEST_CACHE" -eq 0 ]; then
            cp "$BEST_DIR/weather.ics" weather.ics
            echo "can_commit=true" >> "$GITHUB_OUTPUT"
            echo "attempt=$BEST_ATTEMPT" >> "$GITHUB_OUTPUT"
            echo "**Attempt $BEST_ATTEMPT의 완전 최신 결과를 선택했습니다.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "can_commit=false" >> "$GITHUB_OUTPUT"
            if [ -n "$BEST_DIR" ]; then
              echo "**완전 최신 결과가 없어 기존 weather.ics를 유지합니다. 최선 결과의 캐시 사용 날짜 수: $BEST_CACHE**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**5개 러너 모두 유효한 weather.ics 생성에 실패해 기존 파일을 유지합니다.**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Commit and push weather.ics
        if: steps.select.outputs.can_commit == 'true'
        run: |
          if git diff --quiet -- weather.ics; then
            echo "No changes to commit"
            exit 0
          fi

          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.ics
          git commit -m "Update weather.ics [$KST_TIME KST]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail safely when no fully fresh result exists
        if: steps.select.outputs.can_commit != 'true'
        run: |
          echo "::error::5개 러너에서 완전한 최신 데이터를 얻지 못했습니다. 기존 weather.ics는 변경하지 않았습니다."
          exit 1
