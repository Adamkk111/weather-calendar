name: Update Weather ICS

on:
  schedule:
    # GitHub cron은 UTC 기준: KST 02:15, 05:15, 08:15, 11:15,
    # 14:15, 17:15, 20:15, 23:15에 실행됩니다.
    - cron: '15 17,20,23,2,5,8,11,14 * * *'
  repository_dispatch:
    types: [update-weather-ics]
  push:
    branches:
      - main
    paths:
      - 'update_calendar.py'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write

# 서로 다른 워크플로 실행은 겹치지 않게 하고, 한 실행 안의 5개 fetch job만 병렬 실행합니다.
concurrency:
  group: weather-calendar-update
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch attempt ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Record runner IP
        id: runner_ip
        continue-on-error: true
        run: |
          IP=$(curl -fsS --max-time 10 https://api.ipify.org || echo "unknown")
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Runner IP: $IP"

      - name: Update weather calendar
        id: update_weather
        continue-on-error: true
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          KMA_NX: ${{ secrets.KMA_NX }}
          KMA_NY: ${{ secrets.KMA_NY }}
          LOCATION_NAME: ${{ secrets.LOCATION_NAME }}
          REG_ID_TEMP: ${{ secrets.REG_ID_TEMP }}
          REG_ID_LAND: ${{ secrets.REG_ID_LAND }}
          TZ: Asia/Seoul
        run: python -u update_calendar.py

      - name: Build attempt result
        if: always()
        env:
          ATTEMPT: ${{ matrix.attempt }}
          RUNNER_IP: ${{ steps.runner_ip.outputs.ip }}
          SCRIPT_OUTCOME: ${{ steps.update_weather.outcome }}
        run: |
          mkdir -p result

          # 스크립트가 exit 0으로 끝났을 때만 결과 ICS를 성공 후보로 보관합니다.
          if [ "$SCRIPT_OUTCOME" = "success" ] && [ -f weather.ics ]; then
            cp weather.ics result/weather.ics
          fi

          jq -n \
            --argjson attempt "$ATTEMPT" \
            --arg ip "${RUNNER_IP:-unknown}" \
            --arg outcome "$SCRIPT_OUTCOME" \
            --arg has_ics "$([ -f result/weather.ics ] && echo true || echo false)" \
            '{attempt:$attempt, ip:$ip, outcome:$outcome, has_ics:($has_ics == "true")}' \
            > result/report.json

      - name: Upload attempt result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-attempt-${{ matrix.attempt }}
          path: result/
          retention-days: 2

  commit:
    name: Select result and commit
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download attempt results
        uses: actions/download-artifact@v4
        with:
          pattern: weather-attempt-*
          path: attempts
          merge-multiple: false

      - name: Select successful result
        id: select
        shell: bash
        run: |
          echo "### 기상청 API 5개 러너 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Attempt | Runner IP | 결과 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---|---|" >> "$GITHUB_STEP_SUMMARY"

          SELECTED_DIR=""
          SELECTED_ATTEMPT=""

          for DIR in attempts/weather-attempt-*; do
            [ -d "$DIR" ] || continue
            REPORT="$DIR/report.json"
            [ -f "$REPORT" ] || continue

            ATTEMPT=$(jq -r '.attempt' "$REPORT")
            IP=$(jq -r '.ip' "$REPORT")
            OUTCOME=$(jq -r '.outcome' "$REPORT")
            HAS_ICS=$(jq -r '.has_ics' "$REPORT")

            VERDICT="❌ 실패"
            if [ "$OUTCOME" = "success" ] && [ "$HAS_ICS" = "true" ] && [ -f "$DIR/weather.ics" ]; then
              VERDICT="✅ 성공"
              # 모든 성공 결과는 같은 검증을 통과했으므로 첫 성공 결과를 선택합니다.
              if [ -z "$SELECTED_DIR" ]; then
                SELECTED_DIR="$DIR"
                SELECTED_ATTEMPT="$ATTEMPT"
              fi
            fi

            echo "| $ATTEMPT | $IP | $VERDICT |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$SELECTED_DIR" ]; then
            cp "$SELECTED_DIR/weather.ics" weather.ics
            echo "can_commit=true" >> "$GITHUB_OUTPUT"
            echo "attempt=$SELECTED_ATTEMPT" >> "$GITHUB_OUTPUT"
            echo "**Attempt $SELECTED_ATTEMPT 결과를 선택했습니다.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "can_commit=false" >> "$GITHUB_OUTPUT"
            echo "**5개 러너 모두 검증을 통과하지 못해 기존 weather.ics를 유지합니다.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push weather.ics
        if: steps.select.outputs.can_commit == 'true'
        run: |
          if git diff --quiet -- weather.ics; then
            echo "No changes to commit"
            exit 0
          fi

          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.ics
          git commit -m "Update weather.ics [$KST_TIME KST]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail safely if every runner failed
        if: steps.select.outputs.can_commit != 'true'
        run: |
          echo "::error::5개 러너 모두 유효한 날씨 데이터를 만들지 못했습니다. 기존 weather.ics는 변경하지 않았습니다."
          exit 1
