name: Update Weather ICS

on:
  schedule:
    # GitHub cron은 UTC 기준: KST 02:15, 05:15, 08:15, 11:15,
    # 14:15, 17:15, 20:15, 23:15에 실행됩니다.
    - cron: '15 17,20,23,2,5,8,11,14 * * *'
  push:
    branches:
      - main
    paths:
      - 'update_calendar.py'
      - 'requirements.txt'
  workflow_dispatch:

# weather.ics 커밋에 필요한 최소 권한만 사용합니다.
permissions:
  contents: write

# 예약 실행과 수동 실행이 겹쳐 같은 파일을 동시에 갱신하지 않도록 합니다.
concurrency:
  group: weather-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Update weather calendar
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          KMA_NX: ${{ secrets.KMA_NX }}
          KMA_NY: ${{ secrets.KMA_NY }}
          LOCATION_NAME: ${{ secrets.LOCATION_NAME }}
          REG_ID_TEMP: ${{ secrets.REG_ID_TEMP }}
          REG_ID_LAND: ${{ secrets.REG_ID_LAND }}
          TZ: Asia/Seoul
        run: python -u update_calendar.py

      - name: Commit and push weather.ics
        run: |
          if git diff --quiet -- weather.ics; then
            echo "No changes to commit"
            exit 0
          fi

          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.ics
          git commit -m "Update weather.ics [$KST_TIME KST]"
          git pull --rebase origin main
          git push origin HEAD:main
